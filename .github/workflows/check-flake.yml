name: Check Nix flake

on:
  workflow_call:
    inputs:
      flake_dir:
        description: Directory containing flake.nix
        required: false
        type: string
        default: template
      ref:
        description: Git ref to check
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      flake_dir:
        description: Directory containing flake.nix
        required: false
        type: string
        default: template
      ref:
        description: Git ref to check (leave empty to use the selected branch)
        required: false
        type: string
        default: ""
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        env:
          FLAKE_DIR: ${{ inputs.flake_dir || 'template' }}
        run: nix flake check "./$FLAKE_DIR"
